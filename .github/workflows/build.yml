name: Build OpenWrt firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore executable permissions
        run: |
          grep -rlI '^#!' --exclude-dir=.git . 2>/dev/null | xargs -r chmod +x || true
          chmod +x scripts/feeds 2>/dev/null || true
          echo "permissions restored"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses5-dev libncursesw5-dev libz-dev patch unzip zlib1g-dev \
            lib32gcc-s1 libc6-dev-i386 subversion flex bison gcc-multilib g++-multilib \
            p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto \
            qemu-utils upx-ucl libelf-dev autoconf automake libtool autopoint \
            device-tree-compiler rsync file wget python3 python3-distutils ccache \
            perl-modules nodejs npm

      - name: Install GCC 9 (OpenWrt 19.07 requires gcc <= 9)
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-9-multilib g++-9-multilib
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
          sudo update-alternatives --set gcc /usr/bin/gcc-9
          sudo update-alternatives --set g++ /usr/bin/g++-9
          # Set environment variables for build
          echo "CC=gcc-9" >> $GITHUB_ENV
          echo "CXX=g++-9" >> $GITHUB_ENV
          echo "HOSTCC=gcc-9" >> $GITHUB_ENV
          echo "HOSTCXX=g++-9" >> $GITHUB_ENV
          echo "gcc: $(gcc --version | head -1)"
          echo "g++: $(g++ --version | head -1)"

      - name: Setup Python 2.7 (OpenWrt 19.07 requires it)
        run: |
          sudo apt-get install -y libssl1.1 || sudo apt-get install -y libssl3
          sudo apt-get install -y libncurses5-dev libgdbm-dev libnss3-dev libreadline-dev libffi-dev wget
          cd /tmp
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/usr/local --enable-shared --enable-unicode=ucs4
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python2
          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV
          python2.7 -V

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware (make defconfig)
        run: |
          make defconfig

      - name: Download package sources
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        env:
          CC: gcc-9
          CXX: g++-9
          HOSTCC: gcc-9
          HOSTCXX: g++-9
        run: |
          echo "=== Build environment ==="
          echo "gcc: $(gcc --version | head -1)"
          echo "g++: $(g++ --version | head -1)"
          echo "python: $(python --version 2>&1)"
          echo "python2: $(python2 --version 2>&1)"
          echo "=== Starting build ==="
          make -j$(nproc) V=s > build.log 2>&1 || BUILD_FAILED=1
          if [ -n "$BUILD_FAILED" ]; then
            echo "=== BUILD FAILED: error lines ==="
            grep -n -E "Error [0-9]+|error:|ERROR:|No such file or directory|undefined reference|cannot find|Permission denied|Collected errors|satisfy_dependencies|pkg_run_script|out of space|No space left" build.log | tail -200 || true
            echo "=== last 150 lines ==="
            tail -150 build.log
            exit 1
          fi
          echo "=== BUILD SUCCEEDED ==="
          tail -20 build.log

      - name: Verify firmware contents
        run: |
          echo "=== Checking firmware files ==="
          TARGET_DIR="bin/targets/ramips/mt7621"
          ls -la $TARGET_DIR/
          echo ""
          echo "=== Checking sysupgrade.bin structure ==="
          file $TARGET_DIR/*sysupgrade.bin || true
          echo ""
          echo "=== Verifying rootfs contents (unsquashfs) ==="
          sudo apt-get install -y squashfs-tools
          # Extract rootfs from sysupgrade.bin for verification
          mkdir -p /tmp/rootfs-check
          # sysupgrade.bin: first 2048 bytes are header, then kernel, then squashfs rootfs
          # Find squashfs offset
          OFFSET=$(hexdump -C $TARGET_DIR/*sysupgrade.bin | grep -m1 'hsqs' | awk '{print "0x"$1}')
          if [ -n "$OFFSET" ]; then
            dd if=$TARGET_DIR/*sysupgrade.bin of=/tmp/rootfs-check/rootfs.squashfs bs=1 skip=$((OFFSET)) 2>/dev/null
            unsquashfs -d /tmp/rootfs-check/extracted /tmp/rootfs-check/rootfs.squashfs 2>/dev/null || true
            echo "=== Checking critical files ==="
            ls -la /tmp/rootfs-check/extracted/www/cgi-bin/luci 2>/dev/null || echo "WARNING: /www/cgi-bin/luci NOT FOUND"
            ls -la /tmp/rootfs-check/extracted/etc/init.d/uhttpd 2>/dev/null || echo "WARNING: /etc/init.d/uhttpd NOT FOUND"
            ls -la /tmp/rootfs-check/extracted/etc/init.d/dropbear 2>/dev/null || echo "WARNING: /etc/init.d/dropbear NOT FOUND"
            ls -la /tmp/rootfs-check/extracted/www/index.html 2>/dev/null || echo "WARNING: /www/index.html NOT FOUND"
            ls -la /tmp/rootfs-check/extracted/usr/bin/xray 2>/dev/null || echo "WARNING: /usr/bin/xray NOT FOUND"
            ls -la /tmp/rootfs-check/extracted/etc/init.d/shadowsocksr 2>/dev/null || echo "WARNING: /etc/init.d/shadowsocksr NOT FOUND"
          else
            echo "WARNING: Could not find squashfs in sysupgrade.bin"
          fi

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-xiaomi-mir4
          path: bin/targets/ramips/mt7621/
          if-no-files-found: error
